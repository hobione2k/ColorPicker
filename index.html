<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ColorPicker</title>
  <link rel="stylesheet" href="./css/style.css">
  <!-- 描画前にテーマを確定させ、ちらつきを防ぐため head 内で読み込む -->
  <script src="./js/theme.js"></script>
  <!-- 透明色の背景（市松模様 / 白 / 黒）も同じく描画前に確定させる -->
  <script src="./js/alpha-bg.js"></script>
</head>
<body>
  <main class="picker">
    <header class="picker__header">
      <h1 class="picker__title">ColorPicker</h1>
      <!-- ヘッダー右側の表示設定ボタン群 -->
      <div class="picker__header-tools">
        <!-- 透明色の背景の切り替え（市松模様 / 白 / 黒。処理は js/alpha-bg.js）
             ラベルとボタン群をまとめ、狭い画面で折り返しても離れないようにする -->
        <div class="alpha-bg-field">
          <!-- 見た目上のラベル（読み上げはボタン群の aria-label「透明色の背景」で行うため重複させない） -->
          <span class="alpha-bg-field__label" aria-hidden="true">透明色の背景</span>
          <div class="alpha-bg" role="group" aria-label="透明色の背景">
            <button class="alpha-bg__option" type="button" data-alpha-bg-option="checker" aria-pressed="false" title="透明色の背景: 市松模様">
              <span class="alpha-bg__sample alpha-bg__sample--checker" aria-hidden="true"></span>標準
            </button>
            <button class="alpha-bg__option" type="button" data-alpha-bg-option="white" aria-pressed="false" title="透明色の背景: 白">
              <span class="alpha-bg__sample alpha-bg__sample--white" aria-hidden="true"></span>白
            </button>
            <button class="alpha-bg__option" type="button" data-alpha-bg-option="black" aria-pressed="false" title="透明色の背景: 黒">
              <span class="alpha-bg__sample alpha-bg__sample--black" aria-hidden="true"></span>黒
            </button>
          </div>
        </div>
        <!-- ライト / ダークテーマの切り替えボタン（表示内容は js/theme.js が設定） -->
        <button id="theme-toggle" class="theme-toggle" type="button">
          <span class="theme-toggle__icon" aria-hidden="true"></span>
          <span class="theme-toggle__label"></span>
        </button>
      </div>
    </header>

    <!-- 色を視覚的に選ぶエリア -->
    <section class="picker__visual">
      <!-- ピッカー本体: 円形ホイールとその下の透明度スライダーを縦に並べる -->
      <div class="picker__main">
        <!-- 円形ホイール: 外周のリングで色相、中央の四角で彩度・明度を選ぶ -->
        <div id="wheel" class="wheel">
          <!-- 色相リング（円錐グラデーションをドーナツ型にくり抜いたもの） -->
          <div class="wheel__ring"></div>
          <!-- 色相リング上のつまみ（キーボード操作用にフォーカス可能） -->
          <div id="hue-cursor" class="wheel__hue-cursor" tabindex="0" role="slider"
               aria-label="色相" aria-valuemin="0" aria-valuemax="360"></div>

          <!-- 彩度(横)・明度(縦)を選ぶパネル -->
          <div id="sv-panel" class="sv-panel" tabindex="0" aria-label="彩度と明度">
            <div id="sv-cursor" class="sv-panel__cursor"></div>
          </div>

          <!-- 色の変更を元に戻す / やり直すボタン: ホイール下部の左右の隅（円の外側の空き）に配置
               （処理は js/app.js、履歴は js/history.js） -->
          <button id="undo-button" class="field__btn wheel__history wheel__history--undo" type="button" aria-label="元に戻す" title="元に戻す (Ctrl+Z)" disabled><svg class="field__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
          <button id="redo-button" class="field__btn wheel__history wheel__history--redo" type="button" aria-label="やり直す" title="やり直す (Ctrl+Y)" disabled><svg class="field__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        </div>

        <!-- 透明度スライダー（ホイールの真下に配置） -->
        <label class="slider">
          <span class="slider__label">透明度</span>
          <span class="slider__track checker">
            <input id="alpha-slider" class="slider__input slider__input--alpha" type="range" min="0" max="100" step="1">
          </span>
        </label>
      </div>

      <!-- ピッカーの右側: プレビューと各色形式の入力欄を縦に並べる -->
      <div class="picker__side">
        <!-- 選択中の色のプレビュー（背景に市松模様 / 白 / 黒を敷いて透明度を見やすくする） -->
        <div class="preview checker">
          <div id="preview-color" class="preview__color"></div>
        </div>

        <!-- 各色形式の数値入力エリア -->
        <div class="picker__fields">
          <!-- カラーコード -->
          <div class="field">
            <span class="field__name">カラーコード</span>
            <div class="field__inputs">
              <input id="hex-input" class="field__text" type="text" spellcheck="false" maxlength="9" aria-label="カラーコード">
            </div>
            <!-- コピー / 貼り付けボタン（アイコン表示。名前は aria-label / title で補う） -->
            <div class="field__actions">
              <button class="field__btn" type="button" data-copy="hex" aria-label="カラーコードをコピー" title="コピー"><svg class="field__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
              <button class="field__btn" type="button" data-paste="hex" aria-label="カラーコードに貼り付け" title="貼り付け"><svg class="field__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
            </div>
          </div>

          <!-- RGBA -->
          <div class="field">
            <span class="field__name">RGBA</span>
            <div class="field__inputs">
              <input id="rgb-r" type="number" min="0" max="255" step="1" aria-label="赤 (R)" title="赤 (R)">
              <input id="rgb-g" type="number" min="0" max="255" step="1" aria-label="緑 (G)" title="緑 (G)">
              <input id="rgb-b" type="number" min="0" max="255" step="1" aria-label="青 (B)" title="青 (B)">
              <input id="rgb-a" type="number" min="0" max="1" step="0.01" aria-label="透明度 (A)" title="透明度 (A)">
            </div>
            <!-- コピー / 貼り付けボタン（アイコン表示。名前は aria-label / title で補う） -->
            <div class="field__actions">
              <button class="field__btn" type="button" data-copy="rgba" aria-label="RGBAをコピー" title="コピー"><svg class="field__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
              <button class="field__btn" type="button" data-paste="rgba" aria-label="RGBAに貼り付け" title="貼り付け"><svg class="field__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
            </div>
          </div>

          <!-- HSV -->
          <div class="field">
            <span class="field__name">HSV</span>
            <div class="field__inputs">
              <input id="hsv-h" type="number" min="0" max="360" step="1" aria-label="色相 (H)" title="色相 (H)">
              <input id="hsv-s" type="number" min="0" max="100" step="1" aria-label="彩度 (S)" title="彩度 (S)">
              <input id="hsv-v" type="number" min="0" max="100" step="1" aria-label="明度 (V)" title="明度 (V)">
              <input id="hsv-a" type="number" min="0" max="1" step="0.01" aria-label="透明度 (A)" title="透明度 (A)">
            </div>
            <!-- コピー / 貼り付けボタン（アイコン表示。名前は aria-label / title で補う） -->
            <div class="field__actions">
              <button class="field__btn" type="button" data-copy="hsv" aria-label="HSVをコピー" title="コピー"><svg class="field__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
              <button class="field__btn" type="button" data-paste="hsv" aria-label="HSVに貼り付け" title="貼り付け"><svg class="field__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></button>
            </div>
          </div>
        </div>

        <!-- マイカラー操作ボタンの行: HSV パネルの下、透明度スライダーの右側に配置（処理は js/my-colors.js） -->
        <div class="my-colors__actions">
          <!-- 現在の色を保存するボタン（左端） -->
          <button id="my-colors-save" class="my-colors__save" type="button" title="現在の色をマイカラーに保存">＋ 保存</button>
          <!-- JSON ファイルへのエクスポート / JSON ファイルからのインポート（右端） -->
          <div class="my-colors__toolbar">
            <button id="my-colors-export" class="my-colors__tool" type="button" title="保存した色を JSON ファイルに書き出す">エクスポート</button>
            <button id="my-colors-import" class="my-colors__tool" type="button" title="JSON ファイルから色を読み込む">インポート</button>
            <!-- インポート用のファイル選択欄（画面には出さず、インポートボタンから開く） -->
            <input id="my-colors-import-file" type="file" accept=".json,application/json" hidden>
          </div>
        </div>
      </div>
    </section>

    <!-- マイカラー: 保存した色をグリッド状のブロックで一覧表示する（表示内容は js/my-colors.js が生成） -->
    <section class="my-colors" aria-labelledby="my-colors-title">
      <p id="my-colors-empty" class="my-colors__empty">保存した色はありません</p>
      <ul id="my-colors-grid" class="my-colors__grid"></ul>
    </section>

    <!-- ショートカットキー一覧: 見出しをクリックすると開閉するアコーディオンパネル（初期状態は閉じる） -->
    <details class="shortcuts">
      <summary class="shortcuts__summary">ショートカットキー</summary>
      <dl class="shortcuts__list">
        <!-- 変更履歴 -->
        <dt><kbd>Ctrl</kbd> + <kbd>Z</kbd></dt>
        <dd>元に戻す（Undo）</dd>
        <dt><kbd>Ctrl</kbd> + <kbd>Y</kbd> / <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Z</kbd></dt>
        <dd>やり直す（Redo）</dd>
        <!-- ホイール操作（各部分にフォーカスがあるとき） -->
        <dt><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd></dt>
        <dd>色相リングのつまみ: 色相を回す ／ 中央パネル: 彩度（左右）・明度（上下）を調整</dd>
        <dt><kbd>Shift</kbd> + 矢印キー</dt>
        <dd>上記を 10 刻みで調整</dd>
      </dl>
    </details>

    <!-- コピー完了などの通知 -->
    <p id="toast" class="toast" role="status" aria-live="polite"></p>
  </main>

  <!-- フッター: リポジトリとライセンスへのリンク（画面下端に配置） -->
  <footer class="footer">
    <a class="footer__link" href="https://github.com/hobione2k/ColorPicker" target="_blank" rel="noopener noreferrer">Repository</a>
    <span class="footer__sep" aria-hidden="true">|</span>
    <a class="footer__link" href="https://github.com/hobione2k/ColorPicker/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">MIT License</a>
  </footer>

  <script src="./js/color-convert.js"></script>
  <script src="./js/history.js"></script>
  <script src="./js/my-colors.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
